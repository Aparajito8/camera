<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>AI 极速拍题器 v6</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }
    .top-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
    .status { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .room-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 4px 10px; border-radius: 14px; font-size: 12px; backdrop-filter: blur(4px); }
    .viewport { position: relative; flex: 1; width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .aim-box { position: absolute; width: 90%; height: 32%; border: 2px solid #38bdf8; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); pointer-events: none; transition: height 0.1s; }
    .aim-box::before { content: "将题目对准框内 · 按快门直接裁切秒发"; position: absolute; top: -26px; left: 0; right: 0; text-align: center; font-size: 12px; color: #38bdf8; text-shadow: 0 1px 2px #000; }
    .controls { position: absolute; bottom: 0; left: 0; right: 0; z-index: 20; padding: 16px 24px 32px; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); display: flex; flex-direction: column; gap: 14px; align-items: center; }
    .slider-row { width: 85%; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #cbd5e1; }
    .slider-row input { flex: 1; accent-color: #38bdf8; }
    .btn-row { width: 100%; display: flex; justify-content: space-around; align-items: center; }
    .shutter { width: 72px; height: 72px; border-radius: 50%; background: #38bdf8; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: #000; box-shadow: 0 4px 15px rgba(56,189,248,0.5); }
    .shutter:active { transform: scale(0.92); }
    .sub-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 10px 14px; border-radius: 20px; font-size: 13px; }
    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); color: #22c55e; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; z-index: 50; display: none; border: 1px solid #22c55e; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="status">
      <div class="dot"></div>
      <span id="statusText">v6 双通道并发就绪</span>
    </div>
    <button class="room-btn" id="roomBtn">暗号: zw999</button>
  </div>

  <div class="viewport">
    <video id="video" autoplay playsinline muted></video>
    <div id="aimBox" class="aim-box"></div>
  </div>

  <div class="controls">
    <div class="slider-row">
      <span>框高</span>
      <input type="range" id="heightSlider" min="15" max="80" value="32" />
      <span id="heightVal">32%</span>
    </div>
    <div class="btn-row">
      <label class="sub-btn">
        相册选图
        <input type="file" id="fileInput" accept="image/*" style="display:none" />
      </label>
      <button class="shutter" id="shootBtn">秒传</button>
      <button class="sub-btn" id="fullShootBtn">全屏拍</button>
    </div>
  </div>

  <div id="toast" class="toast">⚡ 已秒传</div>
  <canvas id="canvas" style="display:none"></canvas>

  <script>
    let roomCode = localStorage.getItem('ai_snap_room') || 'zw999';
    const roomBtn = document.getElementById('roomBtn');
    roomBtn.textContent = `暗号: ${roomCode}`;
    roomBtn.onclick = () => {
      const next = prompt('修改配对暗号（与平板保持一致）：', roomCode);
      if (next && next.trim()) {
        roomCode = next.trim();
        localStorage.setItem('ai_snap_room', roomCode);
        location.reload();
      }
    };

    // 1. 初始化多节点 MQTT 客户端（主力极速通道）
    const mqttClients = [];
    if (typeof mqtt !== 'undefined') {
      ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'].forEach(url => {
        try {
          const c = mqtt.connect(url, { keepalive: 30, reconnectPeriod: 3000 });
          mqttClients.push(c);
        } catch (e) {}
      });
    }

    // 2. 启动后置摄像头
    const video = document.getElementById('video');
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(stream => { video.srcObject = stream; })
      .catch(err => alert('相机启动失败: ' + err.message));

    const aimBox = document.getElementById('aimBox');
    const heightSlider = document.getElementById('heightSlider');
    const heightVal = document.getElementById('heightVal');
    const savedH = localStorage.getItem('ai_snap_box_h') || '32';
    heightSlider.value = savedH;
    aimBox.style.height = savedH + '%';
    heightVal.textContent = savedH + '%';

    heightSlider.oninput = (e) => {
      const h = e.target.value;
      aimBox.style.height = h + '%';
      heightVal.textContent = h + '%';
      localStorage.setItem('ai_snap_box_h', h);
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const toast = document.getElementById('toast');

    function showToast(msg, isErr = false) {
      toast.textContent = msg;
      toast.style.color = isErr ? '#ef4444' : '#22c55e';
      toast.style.borderColor = isErr ? '#ef4444' : '#22c55e';
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 1500);
    }

    // 3. 双通道并发发送（MQTT + HTTPS Stream 同时推送，任一成功即达）
    async function sendImage(canvasEl) {
      showToast('🚀 正在秒传...');
      const dataUrl = canvasEl.toDataURL('image/jpeg', 0.72);
      const snapId = 'snap_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const payloadStr = JSON.stringify({ id: snapId, ts: Date.now(), dataUrl: dataUrl });
      const sizeKB = Math.round(dataUrl.length / 1024);

      let notified = false;
      function markSuccess() {
        if (notified) return;
        notified = true;
        if (navigator.vibrate) navigator.vibrate(40);
        showToast(`⚡ 已秒传 (${sizeKB}KB)`);
      }

      // 通道一：MQTT 瞬间广播
      const mqttTopic = `ai_snap_v6_mqtt/${roomCode}`;
      mqttClients.forEach(c => {
        if (c && c.connected) {
          c.publish(mqttTopic, payloadStr, { qos: 0 }, (err) => {
            if (!err) markSuccess();
          });
        }
      });

      // 通道二：HTTPS 二进制推送兜底
      canvasEl.toBlob(async (blob) => {
        if (!blob) return;
        try {
          const res = await fetch(`https://ntfy.sh/ai_snap_v6_stream_${roomCode}`, {
            method: 'POST',
            body: blob
          });
          if (res.ok) markSuccess();
        } catch (e) {}
      }, 'image/jpeg', 0.72);
    }

    function captureAndSend(cropToBox = true) {
      if (!video.videoWidth) return;
      const vw = video.videoWidth, vh = video.videoHeight;
      let sx = 0, sy = 0, sw = vw, sh = vh;

      if (cropToBox) {
        const viewRect = video.getBoundingClientRect();
        const boxRect = aimBox.getBoundingClientRect();
        const videoRatio = vw / vh;
        const viewRatio = viewRect.width / viewRect.height;
        let renderW, renderH, offsetX = 0, offsetY = 0;
        if (videoRatio > viewRatio) {
          renderH = viewRect.height;
          renderW = renderH * videoRatio;
          offsetX = (renderW - viewRect.width) / 2;
        } else {
          renderW = viewRect.width;
          renderH = renderW / videoRatio;
          offsetY = (renderH - viewRect.height) / 2;
        }
        const scale = vw / renderW;
        sx = ((boxRect.left - viewRect.left) + offsetX) * scale;
        sy = ((boxRect.top - viewRect.top) + offsetY) * scale;
        sw = boxRect.width * scale;
        sh = boxRect.height * scale;
      }

      const maxDim = 1050;
      const outScale = Math.min(1, maxDim / Math.max(sw, sh));
      canvas.width = Math.round(sw * outScale);
      canvas.height = Math.round(sh * outScale);
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

      sendImage(canvas);
    }

    document.getElementById('shootBtn').onclick = () => captureAndSend(true);
    document.getElementById('fullShootBtn').onclick = () => captureAndSend(false);

    document.getElementById('fileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const maxDim = 1050;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        sendImage(canvas);
      };
      img.src = URL.createObjectURL(file);
      e.target.value = '';
    };
  </script>
</body>
</html>
